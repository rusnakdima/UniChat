[package]
name = "unichat-webapp"
version = "0.4.0"
edition = "2021"

[dependencies]
dioxus = { version = "0.8.0-alpha.1", features = ["html", "macro", "hooks", "signals", "desktop", "router"] }
dioxus-desktop = "0.8.0-alpha.1"
dioxus-shared = { path = "../../dioxus-shared", features = ["dioxus-ui"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", features = ["serde"] }
ts-rs = { version = "8", features = ["chrono-impl"] }
nosql_orm = { git = "https://github.com/rusnakdima/nosql_orm.git", rev = "756a681f151a6388413cf6b5d66f4476d26e8321", features = ["json"] }
regex = "1"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
