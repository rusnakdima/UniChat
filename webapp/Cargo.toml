[package]
name = "unichat-webapp"
version = "0.4.0"
edition = "2021"

[dependencies]
dioxus = { version = "0.8.0-alpha.1", features = ["html", "macro", "hooks", "signals", "desktop", "router"] }
dioxus-desktop = "0.8.0-alpha.1"
dioxus-shared = { path = "../../dioxus-shared", features = ["dioxus-ui"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
ts-rs = { version = "8", features = ["chrono-impl"] }
env_logger = "0.11"

[profile.release]
lto = true
codegen-units = 1
